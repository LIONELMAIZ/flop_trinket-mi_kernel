name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git make bc bison flex libssl-dev libelf-dev python3 zip gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Download toolchain
        run: |
          mkdir -p ~/toolchain
          git clone --depth=1 https://github.com/ZyCromerZ/Clang --single-branch ~/toolchain/clang

      - name: Build kernel
        run: |
          export PATH="$HOME/toolchain/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          mkdir -p out
          make O=out ARCH=arm64 ginkgo-stock_defconfig
          cat arch/arm64/configs/ksu.config >> out/.config
          echo 'CONFIG_LITTLE_CPU_MASK=63' >> out/.config
          echo 'CONFIG_BIG_CPU_MASK=192' >> out/.config
          make O=out ARCH=arm64 olddefconfig
          make -j$(nproc) O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          zip -r9 ../FloppyKernel-KSUN.zip . -x '*.git*'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FloppyKernel-KSUN
          path: FloppyKernel-KSUN.zip
